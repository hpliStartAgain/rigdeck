[workspace]
resolver = "2"
members = [
    "crates/rigdeck-core",
    "crates/rigdeck-store",
    "crates/rigdeck-adapter-sdk",
    "crates/rigdeck-adapters",
    "crates/rigdeck-registry",
    "crates/rigdeck-security",
    "crates/rigdeck-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/user/rigdeck"
rust-version = "1.75"

[workspace.dependencies]
# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
blake3 = "1.5"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File watching
notify = "6.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async
tokio = { version = "1.36", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Path handling
camino = "1.1"

# Internal crates
rigdeck-core = { path = "crates/rigdeck-core" }
rigdeck-store = { path = "crates/rigdeck-store" }
rigdeck-adapter-sdk = { path = "crates/rigdeck-adapter-sdk" }
rigdeck-adapters = { path = "crates/rigdeck-adapters" }
rigdeck-registry = { path = "crates/rigdeck-registry" }
rigdeck-security = { path = "crates/rigdeck-security" }
