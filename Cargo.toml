[workspace]
resolver = "2"
members = [
    "crates/rigdeck-core",
    "crates/rigdeck-store",
    "crates/rigdeck-adapter-sdk",
    "crates/rigdeck-adapters",
    "crates/rigdeck-registry",
    "crates/rigdeck-security",
    "crates/rigdeck-service",
    "crates/rigdeck-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/user/rigdeck"
# 依赖锁文件中最高的 MSRV 为 1.88（Tauri 2.11.5 本身要求 1.77.2）。
# 应用项目提交 Cargo.lock，因此这里声明“实际可复现依赖图”的最低版本。
rust-version = "1.88"

[workspace.dependencies]
# Storage
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
refinery = { version = "0.8", features = ["rusqlite"] }
blake3 = "1.5"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File watching
notify = "6.1"
glob = "0.3.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async
tokio = { version = "1.36", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Path handling
camino = { version = "1.1", features = ["serde1"] }
tempfile = "3.12"
chacha20poly1305 = "0.10"
keyring = "4.1"
toml_edit = "0.22.27"
serde_yaml = "0.9.34"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
async-trait = "0.1"
url = "2.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
getrandom = "0.3"

# Internal crates
rigdeck-core = { path = "crates/rigdeck-core" }
rigdeck-store = { path = "crates/rigdeck-store" }
rigdeck-adapter-sdk = { path = "crates/rigdeck-adapter-sdk" }
rigdeck-adapters = { path = "crates/rigdeck-adapters" }
rigdeck-registry = { path = "crates/rigdeck-registry" }
rigdeck-security = { path = "crates/rigdeck-security" }
rigdeck-service = { path = "crates/rigdeck-service" }
